<div class="settings-module">
    <div class="page-header glass-panel">
        <div class="header-left">
            <span class="settings-main-title">系统设置</span>
        </div>
        <span class="settings-sub-title">个性化您的浏览体验</span>
    </div>

    <div class="settings-layout">
        <div class="settings-card glass-panel">
            <div class="card-text-header">显示与外观</div>
            <div class="card-body">
                
                <div class="setting-item">
                    <div class="setting-label">
                        <i class="fa-regular fa-moon"></i>
                        <span>深色/亮色模式</span>
                    </div>
                    <div class="toggle-container">
                        <label class="border-toggle-switch">
                            <input type="checkbox" id="darkModeToggle">
                            <span class="border-slider"></span>
                        </label>
                    </div>
                </div>

                <div class="setting-item">
                    <div class="setting-label">
                        <i class="fa-regular fa-eye"></i>
                        <span>毛玻璃模糊度</span>
                    </div>
                    <div class="range-container">
                        <span class="range-label">模糊</span>
                        <input type="range" min="5" max="25" value="15" class="glass-slider" id="blurSlider">
                        <span class="range-label">清晰</span>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
