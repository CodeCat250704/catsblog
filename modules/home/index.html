<div class="home-module">
    <!-- 顶部标题 -->
    <div class="page-header glass-panel" style="padding: 15px 30px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-weight: 600; color: #ffffff;">Cat Blog</h2>
        <span style="font-size: 14px; color: rgba(255,255,255,0.7);">新一代博客</span>
    </div>

    <!-- 轮播图区域 -->
    <div class="hero-carousel glass-panel" id="heroCarousel">
        <button class="carousel-btn prev"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="carousel-track-container">
            <!-- 将由 JS 动态渲染 <ul class="carousel-track"> -->
            <ul class="carousel-track" id="carouselTrack"></ul>
        </div>
        <button class="carousel-btn next"><i class="fa-solid fa-chevron-right"></i></button>
        <!-- 将由 JS 动态渲染指示点 -->
        <div class="carousel-indicators" id="carouselIndicators"></div>
    </div>

    <!-- 三列卡片布局 -->
    <div class="three-col-grid">
        <!-- 公告版 -->
        <div class="card glass-panel">
            <div class="card-header">公告版</div>
            <div class="card-body" id="announcementList"></div>
        </div>
        <!-- 历史发布 -->
        <div class="card glass-panel">
            <div class="card-header">历史发布</div>
            <div class="card-body">
                <ul id="historyList" style="list-style: none; line-height: 1.8;"></ul>
            </div>
        </div>
        <!-- 音乐列表 -->
        <div class="card glass-panel">
            <div class="card-header">音乐列表</div>
            <div class="card-body" id="musicList"></div>
        </div>
    </div>
</div>
