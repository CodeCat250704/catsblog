<div class="collection-module">
    
    <!-- 最顶层：浏览器多标签页栏 -->
    <div id="global-tab-bar" class="global-tab-bar glass-panel">
        <!-- 此处将由 JS 动态插入标签页 -->
    </div>

    <!-- 下方三栏主体容器 -->
    <div class="win11-layout glass-panel">
        <!-- 1. 左侧：筛选列表 + 搜索 -->
        <div class="nav-pane">
            <div class="address-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="搜索收藏..." autocomplete="off">
                <i class="fa-solid fa-xmark" id="clear-search-btn"></i>
            </div>
            <div id="collection-filter-list" class="nav-tree-list"></div>
        </div>

        <!-- 2. 中间：缩窄的收藏文章列表 -->
        <div class="content-pane">
            <div id="collection-article-list" class="pane-list"></div>
        </div>

        <!-- 3. 右侧：阅读预览区 -->
        <div class="reader-pane">
            <div class="reading-content" id="embedded-reader-content">
                <div class="empty-preview">
                    <h1>收藏阅读区域</h1>
                    <p>请从左侧选择收藏的文章以开始阅读</p>
                </div>
            </div>
        </div>
    </div>
</div>
