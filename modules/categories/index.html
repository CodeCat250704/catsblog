<div class="categories-module">
    <!-- 顶部标题条 -->
    <div class="page-header glass-panel">
        <h2>分类归档</h2>
    </div>

    <!-- 三栏主容器 -->
    <div class="three-column-layout glass-panel">
        
        <!-- 1. 最左侧列：切换分类 -->
        <div class="col-category-switch">
            <div class="col-title">切换分类</div>
            <div id="category-switch-list" class="scroll-list">
                <!-- JS 动态渲染分类按钮 -->
            </div>
        </div>

        <!-- 2. 中间列：同级文章列表 -->
        <div class="col-article-list">
            <div class="col-title">快速切换同级文章</div>
            <div id="article-switch-list" class="scroll-list">
                <!-- JS 动态渲染文章列表 -->
            </div>
        </div>

        <!-- 3. 右侧大区域：阅读文章预览 -->
        <div class="col-reading-area">
            <div class="reading-content" id="reading-content">
                <!-- JS 动态渲染文章预览 -->
                <div class="empty-preview">
                    <h1>阅读文章区域</h1>
                    <p>请从左侧选择分类与文章以开始阅读</p>
                </div>
            </div>
        </div>
    </div>
</div>
