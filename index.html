<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cat Blog</title>
    
    <!-- 反调试防御优先加载，一旦打开开发者工具瞬间跳转 -->
    <script src="assets/anti-debug.js"></script>

    <!-- FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.4.0/css/all.min.css">
    <!-- 全局公共样式 -->
    <link rel="stylesheet" href="assets/common.css">
    
    <!-- 使用系统原生字体 -->
    <style>
        pre, code {
            font-family: 'Courier New', Consolas, monospace !important;
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
        }
    </style>
    
    <!-- 【反调试映射声明】 -->
    <!--# sourceMappingURL=/_fake_source/fake_common.js -->
    
    <!-- 引入路由 -->
    <script src="assets/common.js" defer></script>
    
    <!-- ========================================================== -->
    <!-- 【内嵌 Apple Hello 启动页样式】 -->
    <!-- ========================================================== -->
    <style>
        /* 强制全屏 */
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; font-family: -apple-system, sans-serif;
        }

        /* 启动页覆盖层 */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('background.jpeg') no-repeat center center / cover;
            z-index: 99999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background-color: rgba(0, 0, 0, 0.3);
            background-blend-mode: overlay;
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 1;
        }

        /* 内容 */
        #splash-screen .brand-logo {
            font-size: 100px; color: #ffffff;
            margin-bottom: 10px; opacity: 0.9;
            text-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: softPulse 3s ease-in-out infinite;
        }
        @keyframes softPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        #splash-screen h1 {
            font-size: 44px; font-weight: 300; letter-spacing: 8px;
            color: #ffffff; margin: 0; text-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        #splash-screen .version {
            color: rgba(255,255,255,0.7); font-size: 16px;
            margin-top: 6px; letter-spacing: 2px;
        }

        /* 2秒倒计时 */
        #splash-screen .enter-trigger {
            position: absolute; bottom: 60px; left: 0; width: 100%;
            text-align: center; color: #ffffff; font-size: 16px;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            opacity: 0.8;
        }
        #splash-screen .enter-trigger i {
            font-size: 24px;
            animation: bounceArrow 2s ease-in-out infinite;
        }
        @keyframes bounceArrow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body id="app-body">
    <!-- 全局背景层 -->
    <div class="background-layer"></div>

    <!-- 【启动页覆盖层】 -->
    <div id="splash-screen">
        <div class="brand-logo">
            <i class="fa-solid fa-cat"></i>
        </div>
        <h1>Cat Blog</h1>
        <p class="version">版本 26H4</p>
        <div class="enter-trigger" id="enterTrigger">
            <span id="countdown-text">2 秒后自动进入</span>
            <i class="fa-solid fa-arrow-up"></i>
        </div>
    </div>

    <!-- 主布局容器 -->
    <div id="app-container" style="display: none;">
        <main id="main-content" class="content-area">
            <!-- 动态加载 -->
        </main>
    </div>

        <!-- Win11 风格底部任务栏 (完美对齐版) -->
    <div id="taskbar">
        <!-- 左侧：实时时钟 -->
        <div id="taskbar-clock" class="taskbar-left">
            <span id="clock-display" style="color:#fff; font-size:13px; font-weight:500;">加载时间...</span>
        </div>

        <!-- 中间：菜单 -->
        <div class="taskbar-center">
            <!-- 猫咪开始菜单 -->
            <div id="start-menu-btn" class="taskbar-start-btn" style="cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 6px; transition: 0.2s;">
                <i class="fa-solid fa-cat" style="font-size: 20px; color: #fff;"></i>
            </div>

            <!-- 导航项 -->
            <div class="taskbar-item active" data-module="home">
                <i class="fa-solid fa-house"></i><span>首页</span>
            </div>
            <div class="taskbar-item" data-module="categories">
                <i class="fa-solid fa-layer-group"></i><span>分类</span>
            </div>
            <div class="taskbar-item" data-module="collection">
                <i class="fa-regular fa-star"></i><span>收藏</span>
            </div>
            <div class="taskbar-item" data-module="notice">
                <i class="fa-regular fa-bell"></i><span>通知</span>
            </div>
            <div class="taskbar-item" data-module="co-create">
                <i class="fa-solid fa-hand-holding-heart"></i><span>共创</span>
            </div>
            <div class="taskbar-item" data-module="submit">
                <i class="fa-solid fa-upload"></i><span>投稿</span>
            </div>
            <div class="taskbar-item" data-module="about">
                <i class="fa-solid fa-circle-info"></i><span>关于</span>
            </div>
        </div>

        <!-- 右侧：设置和音量 -->
        <div class="taskbar-right">
            <div class="volume-control">
                <i class="fa-solid fa-volume-high" id="vol-icon" style="font-size: 15px; color: #fff;"></i>
                <input type="range" id="global-volume-slider" min="0" max="100" value="50">
            </div>
            <div class="taskbar-settings" id="settings-btn" data-module="settings">
                <i class="fa-solid fa-gear"></i> <span>设置</span>
            </div>
        </div>
    </div>

    <!-- 脚本引入 -->
    <script src="assets/security.js" defer></script>

    <!-- 全局阅读模态框 -->
    <div id="immersive-reader-modal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 99999; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;">
        <div id="reader-modal-content" style="width: 92%; max-width: 1100px; height: 90vh; background: #ffffff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; position: relative; transform: scale(0.95); transition: transform 0.3s ease;">
            <div style="flex-shrink: 0; height: 56px; padding: 0 24px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; background: #f8f9fa;">
                <h2 id="modal-title" style="margin: 0; font-size: 18px; font-weight: 600; color: #1a1a1a; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">文章标题</h2>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <span id="modal-meta" style="font-size: 13px; color: #6b7280;">分类 · 日期</span>
                    <button id="modal-close-btn" style="background: #ff5f57; border: none; width: 14px; height: 14px; border-radius: 50%; cursor: pointer; transition: filter 0.2s;" title="关闭阅读器 (ESC)"></button>
                </div>
            </div>
            <div id="modal-body" style="flex: 1; overflow-y: auto; padding: 40px 60px; box-sizing: border-box; background: #ffffff; color: #222;">
                <!-- 内容渲染 -->
            </div>
        </div>
    </div>

    <!-- 【内嵌启动控制脚本 (2秒倒计时)】 -->
    <script>
        (function() {
            var splash = document.getElementById('splash-screen');
            var container = document.getElementById('app-container');
            var countdownText = document.getElementById('countdown-text');
            var countdown = 2;

            function enterMainSite() {
                if (splash.style.opacity === '0') return;
                splash.style.opacity = '0';
                splash.style.transform = 'scale(1.05)';
                container.style.display = 'flex';
                setTimeout(function() {
                    splash.style.display = 'none';
                }, 800);
            }

            // 倒计时
            var timer = setInterval(function() {
                countdown--;
                countdownText.textContent = countdown + ' 秒后自动进入';
                if (countdown <= 0) {
                    clearInterval(timer);
                    enterMainSite();
                }
            }, 1000);

            // 点击进入
            document.getElementById('enterTrigger').addEventListener('click', function(e) {
                e.preventDefault();
                clearInterval(timer);
                enterMainSite();
            });

            // 双击进入
            document.addEventListener('dblclick', function(e) {
                if (splash.style.display !== 'none') {
                    clearInterval(timer);
                    enterMainSite();
                }
            });
        })();
    </script>

</body>
</html>
