<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Blog</title>
    <!-- FontAwesome 图标库 (严格避免 Emoji) -->
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.4.0/css/all.min.css">
    <!-- 全局公共样式 -->
    <link rel="stylesheet" href="assets/common.css">
        <!-- 引入代码高亮样式 (国内极速镜像) -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <!-- 【反调试映射声明】 此声明告知浏览器：所有真实 JS 的源码映射指向伪代码文件夹 -->
    <!--# sourceMappingURL=/_fake_source/fake_common.js -->
    
    <!-- 引入 3D 视差和路由脚本 -->
    <script src="assets/common.js" defer></script>
</head>
<body>
    <!-- 背景层：全局视觉背景 -->
    <div class="background-layer"></div>

    <!-- 3D 透视容器 -->
    <div id="app-container">
        <!-- 左侧悬浮导航栏 -->
        <nav id="sidebar" class="glass-panel">
            <div class="brand">
                <i class="fa-solid fa-cat"></i>
            </div>
            <ul class="nav-links">
                <li class="active" data-module="home"><i class="fa-solid fa-house"></i><span>首页</span></li>
                <li data-module="categories"><i class="fa-solid fa-layer-group"></i><span>分类</span></li>
                <li data-module="collection"><i class="fa-regular fa-star"></i><span>收藏</span></li>
                <li data-module="notice"><i class="fa-regular fa-bell"></i><span>通知</span></li>
                <li data-module="co-create"><i class="fa-solid fa-hand-holding-heart"></i><span>共创</span></li>
                <li data-module="submit"><i class="fa-solid fa-upload"></i><span>投稿</span></li>
                <li data-module="about"><i class="fa-solid fa-circle-info"></i><span>关于</span></li>
            </ul>
            <div class="settings-wrapper">
                <button id="settings-btn" data-module="settings"><i class="fa-solid fa-gear"></i></button>
            </div>
        </nav>

        <!-- 右侧内容渲染区 -->
        <main id="main-content" class="content-area">
            <!-- 页面内容将通过 common.js 动态渲染到这里 -->
        </main>
    </div>

    <!-- ============================================== -->
    <!-- 【防伪代码重定向】                               -->
    <!-- 注入一个额外的 JS 加载器，误导调试器指向伪代码   -->
    <!-- 本地开发调试时，请注释掉下方这个 <script> 块     -->
    <!-- ============================================== -->
   
    <script>
        (function(){
            // 如果黑客打开了 F12，浏览器会在这里加载一个假文件，替代真实文件的显示路径
            var fakeMap = document.createElement('script');
            fakeMap.src = '/_fake_source/fake_common.js';
            fakeMap.type = 'text/javascript';
            document.head.appendChild(fakeMap);
        })();
    </script>
   


    <!-- 引入全局安全与自定义右键菜单 JS -->
    <script src="assets/security.js" defer></script>
        <!-- ========================================================== -->
    <!-- 【全局沉浸式阅读模态框】 -->
    <!-- ========================================================== -->
    <div id="immersive-reader-modal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 99999; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;">
        <!-- 模态框主体 -->
        <div id="reader-modal-content" style="width: 92%; max-width: 1100px; height: 90vh; background: #ffffff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; position: relative; transform: scale(0.95); transition: transform 0.3s ease;">
            
            <!-- 模态框头部 -->
            <div style="flex-shrink: 0; height: 56px; padding: 0 24px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; background: #f8f9fa;">
                <h2 id="modal-title" style="margin: 0; font-size: 18px; font-weight: 600; color: #1a1a1a; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">文章标题</h2>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <span id="modal-meta" style="font-size: 13px; color: #6b7280;">分类 · 日期</span>
                    <button id="modal-close-btn" style="background: #ff5f57; border: none; width: 14px; height: 14px; border-radius: 50%; cursor: pointer; transition: filter 0.2s;" title="关闭阅读器 (ESC)"></button>
                </div>
            </div>

            <!-- 模态框文章内容区 (绝对防溢出) -->
            <div id="modal-body" style="flex: 1; overflow-y: auto; padding: 40px 60px; box-sizing: border-box; background: #ffffff; color: #222;">
                <!-- 文章内容将由 JS 渲染在这里 -->
            </div>
        </div>
    </div>
</body>
</html>
